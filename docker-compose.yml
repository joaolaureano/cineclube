services:
  node-api:
    build: ./backend
    image: cineclube-backend
    container_name: api
    restart: always
    env_file: ./.env
    # publicado so no loopback: quem alcanca a API de fora e o nginx do
    # servico web. O health check do bootstrap continua funcionando.
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    networks:
      - app-network
    # migrations rodam a cada boot por serem idempotentes; o seed não é e
    # continua sendo um passo manual (npm run db:seed)
    command: sh -c "npm run typeorm -- migration:run && node dist/src/index.js"

  web:
    build:
      context: ./frontend
      args:
        # relativo de proposito: o bundle nao carrega o endereco da instancia,
        # entao trocar o Elastic IP nao obriga a recompilar o frontend
        REACT_APP_API_URL: /api/v1
    image: cineclube-frontend
    container_name: web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - node-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
