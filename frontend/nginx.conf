server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy de mesma origem: sem CORS e sem o IP da instancia dentro do bundle
    location /api/ {
        proxy_pass http://node-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://node-api:5000/health;
    }

    # o react-router resolve as rotas no cliente: caminho desconhecido devolve
    # o index em vez de 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
